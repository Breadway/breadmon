[package]
name = "breadmon"
version = "0.1.2"
edition = "2021"
description = "TUI monitor manager for Hyprland"
license = "MIT"

[[bin]]
name = "breadmon"
path = "src/main.rs"

[dependencies]
ratatui    = "0.29"
crossterm  = { version = "0.28", features = ["event-stream"] }
tokio      = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "sync", "time", "net", "io-util"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
anyhow     = "1"
dirs       = "5"
futures    = "0.3"
bread-utils = { git = "https://git.breadway.dev/Breadway/bread-ecosystem", tag = "v0.7.1", features = ["bread-client"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
